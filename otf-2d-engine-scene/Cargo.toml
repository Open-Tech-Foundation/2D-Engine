[package]
name = "otf-2d-engine-scene"
description = "Immutable scene IR and encoder for the 2D-Engine vector graphics engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["otf-2d-engine-geom/std", "otf-2d-engine-color/std", "smallvec/write"]
libm = ["otf-2d-engine-geom/libm", "otf-2d-engine-color/libm"]

[dependencies]
otf-2d-engine-geom.workspace = true
otf-2d-engine-color.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
smallvec = { workspace = true, features = ["union", "const_generics"] }
rustc-hash.workspace = true

[dev-dependencies]
otf-2d-engine-testing.workspace = true
proptest.workspace = true
static_assertions.workspace = true
