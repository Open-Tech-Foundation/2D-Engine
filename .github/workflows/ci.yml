name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Doc 01 §5: x86-64 and aarch64 are both first-class raster targets.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install '${{ steps.msrv.outputs.version }}' --profile minimal
          rustup target add thumbv7em-none-eabi
      - name: Install cross target
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: ci/check.sh
        env:
          # The aarch64 runner is already native; cross-checking it is redundant.
          OTF_SKIP_CROSS: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}
        run: ./ci/check.sh
