name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the exhaustive and soak tests marked #[ignore].
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Doc 01 §5: x86-64 and aarch64 are both first-class raster targets.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"
      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install '${{ steps.msrv.outputs.version }}' --profile minimal
          rustup target add thumbv7em-none-eabi
      - name: Install cross target
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: ci/check.sh
        env:
          # The aarch64 runner is already native; cross-checking it is redundant.
          OTF_SKIP_CROSS: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}
          # Shared CI runners are too noisy for a timing gate; benchmarks run
          # on the dedicated job below.
          OTF_SKIP_BENCH: '1'
        run: ./ci/check.sh

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Compare against the tracked baseline
        run: ./ci/check.sh bench

  exhaustive:
    name: exhaustive tests
    # Doc 03 §8 schedules the exhaustive and soak suites nightly rather than
    # per-commit; they are marked #[ignore] so they never run by accident.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release -- --ignored
