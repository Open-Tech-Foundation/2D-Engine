[package]
name = "otf-2d-engine"
description = "A 2D vector graphics engine with immutable scenes, rendering to raster or vector targets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Every crate forwards `std` and `libm` rather than deciding for itself: a
# consumer picks a float-math backend once, at the top of the tree.
std = ["otf-2d-engine-geom/std", "otf-2d-engine-color/std", "otf-2d-engine-scene/std", "otf-2d-engine-raster/std", "otf-2d-engine-cpu/std", "otf-2d-engine-cache/std"]
libm = ["otf-2d-engine-geom/libm", "otf-2d-engine-color/libm", "otf-2d-engine-scene/libm", "otf-2d-engine-raster/libm", "otf-2d-engine-cpu/libm", "otf-2d-engine-cache/libm"]

[dependencies]
otf-2d-engine-geom.workspace = true
otf-2d-engine-color.workspace = true
otf-2d-engine-scene.workspace = true
otf-2d-engine-raster.workspace = true
otf-2d-engine-cpu.workspace = true
otf-2d-engine-cache.workspace = true
