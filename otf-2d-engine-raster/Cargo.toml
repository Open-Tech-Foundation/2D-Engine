[package]
name = "otf-2d-engine-raster"
description = "Flatten, bin, strip and fine-raster stages for the 2D-Engine vector graphics engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Every crate forwards `std` and `libm` rather than deciding for itself: a
# consumer picks a float-math backend once, at the top of the tree.
std = ["otf-2d-engine-geom/std", "otf-2d-engine-color/std", "otf-2d-engine-scene/std", "smallvec/write"]
libm = ["otf-2d-engine-geom/libm", "otf-2d-engine-color/libm", "otf-2d-engine-scene/libm"]

[dependencies]
otf-2d-engine-geom.workspace = true
otf-2d-engine-color.workspace = true
otf-2d-engine-scene.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
smallvec = { workspace = true, features = ["union", "const_generics"] }

[dev-dependencies]
otf-2d-engine-testing.workspace = true
static_assertions.workspace = true
