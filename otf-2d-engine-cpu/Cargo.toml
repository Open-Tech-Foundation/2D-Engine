[package]
name = "otf-2d-engine-cpu"
description = "CPU raster backend for the 2D-Engine vector graphics engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Every crate forwards `std` and `libm` rather than deciding for itself: a
# consumer picks a float-math backend once, at the top of the tree.
std = ["otf-2d-engine-geom/std", "otf-2d-engine-color/std", "otf-2d-engine-scene/std", "otf-2d-engine-raster/std"]
libm = ["otf-2d-engine-geom/libm", "otf-2d-engine-color/libm", "otf-2d-engine-scene/libm", "otf-2d-engine-raster/libm"]

[dependencies]
otf-2d-engine-geom.workspace = true
otf-2d-engine-color.workspace = true
otf-2d-engine-scene.workspace = true
otf-2d-engine-raster.workspace = true

[dev-dependencies]
otf-2d-engine-raster = { workspace = true, features = ["std"] }
otf-2d-engine-testing.workspace = true
tiny-skia.workspace = true
static_assertions.workspace = true
