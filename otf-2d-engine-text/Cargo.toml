[package]
name = "otf-2d-engine-text"
description = "Optional shaping, bidi and font fallback for the 2D-Engine vector graphics engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Every crate forwards `std` and `libm` rather than deciding for itself: a
# consumer picks a float-math backend once, at the top of the tree.
std = ["otf-2d-engine-scene/std"]
libm = ["otf-2d-engine-scene/libm"]

[dependencies]
otf-2d-engine-scene.workspace = true
